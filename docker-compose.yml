# Single-instance stack for infinite-node-application (app + MongoDB + Redis).
#
# Setup:
#   1. cp .env.example .env
#   2. Fill in COOKIE_SECRET, SESSION_SECRET, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, etc.
#      (see .env.example for generation instructions)
#   3. docker compose up -d --build
#
# Observability (traces, metrics, logs in Grafana): add the overlay file —
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#
# MONGODB_URI / REDIS_* below are hardcoded to the in-network service hostnames
# and intentionally override whatever is set in .env — everything else in .env
# (secrets, app config, driver toggles) is passed through as-is.

services:
  app:
    build:
      context: .
      target: production
    image: ${APP_NAME}:local
    container_name: ${APP_NAME}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NODE_PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/infinite-node-application?replicaSet=rs0
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_URL: redis://redis:6379
      REDIS_SOCKET_HOST: redis
      # No telemetry backend in this stack — docker-compose.observability.yml turns it on
      OTEL_SDK_DISABLED: 'true'
    ports:
      - '3000:3000'
    volumes:
      - app_logs:/app/logs
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ${APP_NAME}-mongodb
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot job that initializes the single-node replica set (required for
  # multi-document transactions used by the application/domain services).
  mongodb-init:
    image: mongo:7
    container_name: ${APP_NAME}-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb --quiet --eval "
      try {
        rs.status();
      } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
      }
      "
    restart: 'no'

  # One-shot job that seeds the database (default resources/roles/user groups/users).
  # Runs the `seed:prod` npm script (compiled seeder — the production image has no tsx/src).
  # Safe to re-run — each seeder skips records that already exist.
  seed:
    # No build: block — reuses the image the `app` service already built/tagged.
    image: ${APP_NAME}:local
    container_name: ${APP_NAME}-seed
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/infinite-node-application?replicaSet=rs0
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_URL: redis://redis:6379
      REDIS_SOCKET_HOST: redis
    command: ['npm', 'run', 'seed:prod']
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: 'no'

  # BullMQ worker — same image as `app`, different command. No HTTP server, so no
  # ports and no HTTP healthcheck (the image's baked-in HEALTHCHECK is disabled below).
  worker:
    # No build: block — reuses the image the `app` service already built/tagged.
    image: ${APP_NAME}:local
    container_name: ${APP_NAME}-worker
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/infinite-node-application?replicaSet=rs0
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_URL: redis://redis:6379
      REDIS_SOCKET_HOST: redis
      WINSTON_LOG_FILE_NAME: ./logs/worker-%DATE%.log
      WINSTON_ERROR_LOG_FILE_NAME: ./logs/worker-error-%DATE%.log
      # No telemetry backend in this stack — docker-compose.observability.yml turns it on
      OTEL_SDK_DISABLED: 'true'
    command: ['dumb-init', 'npm', 'run', 'worker:start']
    healthcheck:
      disable: true
    volumes:
      - app_logs:/app/logs
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # MailHog — SMTP test server for local development only. Catches outgoing
  # email instead of delivering it (Web UI at http://localhost:8025).
  # Guarded behind the "dev" profile so it never starts as part of the
  # default/production stack: `docker compose --profile dev up -d --build`.
  # Point EMAIL_SMTP_HOST=mailhog, EMAIL_SMTP_PORT=1025, EMAIL_SMTP_SECURE=false
  # in .env.production to route app email through it.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${APP_NAME}-mailhog
    profiles: ['dev']
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  app_logs:
